name: Syntax checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python application
        run: python -m compileall -q app

      - name: Check dashboard JavaScript syntax
        run: node --check app/static/app.js
